name: Daily family reminders

on:
  schedule:
    # Été (CEST: UTC+2) → 05:30 UTC = 07:30 Paris
    - cron: '30 5 * * *'
    # Hiver (CET: UTC+1) → 06:30 UTC = 07:30 Paris
    - cron: '30 6 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel cron endpoint
        env:
          URL: ${{ secrets.CRON_PING_URL }}
        run: |
          echo "GET $URL"
          curl -fsSL "$URL" -H "User-Agent: github-actions-cron" -m 30
