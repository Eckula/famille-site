name: Daily family reminders

on:
  schedule:
    # 07:30 Paris toute l'année (été/hiver)
    - cron: '30 5 * * *'
    - cron: '30 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-family-reminders
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Laisse passer uniquement le créneau adapté (évite 2 mails par jour)
      - name: Decide if this run is the right one (DST-aware)
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          OFF=$(TZ='Europe/Paris' date +%z)   # +0200 ou +0100
          OFF_H=${OFF:0:3}
          if [[ "$OFF_H" == "+02" ]]; then EXPECTED=05; else EXPECTED=06; fi
          NOW_UTC=$(date -u +%H)
          echo "Paris offset=$OFF_H, expected UTC hour=$EXPECTED, now UTC=$NOW_UTC"
          if [[ "$NOW_UTC" != "$EXPECTED" && "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            echo "SHOULD_RUN=false" >> "$GITHUB_ENV"
          else
            echo "SHOULD_RUN=true" >> "$GITHUB_ENV"
          fi

      - name: Call Vercel cron endpoint
        if: env.SHOULD_RUN == 'true'
        shell: bash
        env:
          URL: ${{ secrets.CRON_PING_URL }}   # https://famille-merenge.vercel.app/api/cron/daily?force=1
          KEY: ${{ secrets.CRON_PING_KEY }}   # valeur de CRON_SECRET (Vercel)
        run: |
          set -euo pipefail
          URL_CLEAN="$(printf '%s' "${URL:-}" | tr -d '\r\n')"
          KEY_CLEAN="$(printf '%s' "${KEY:-}" | tr -d '\r\n')"
          if [ -z "$URL_CLEAN" ]; then
            echo "Missing secret: CRON_PING_URL" >&2; exit 1
          fi
          HDR=(-H "User-Agent: github-actions-cron")
          [ -n "$KEY_CLEAN" ] && HDR+=(-H "x-cron-key: $KEY_CLEAN")
          echo "GET $URL_CLEAN"
          for i in 1 2 3; do
            if curl -fsS -m 30 "${HDR[@]}" "$URL_CLEAN" >/dev/null; then
              echo "Ping OK"; exit 0
            fi
            echo "Retry $i/3…"; sleep 5
          done
          echo "Ping failed after retries" >&2; exit 1
