name: Daily family reminders

on:
  schedule:
    - cron: '30 5 * * *'   # 07:30 Paris (été, UTC+2)
    - cron: '30 6 * * *'   # 07:30 Paris (hiver, UTC+1)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-family-reminders
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call Vercel cron endpoint
        shell: bash
        env:
          URL: ${{ secrets.CRON_PING_URL }}   # ex: https://famille-merenge.vercel.app/api/cron/daily?force=1
          KEY: ${{ secrets.CRON_PING_KEY }}   # valeur de CRON_SECRET (copiée depuis Vercel)
        run: |
          set -euo pipefail
          URL_CLEAN="$(printf '%s' "${URL:-}" | tr -d '\r\n')"
          KEY_CLEAN="$(printf '%s' "${KEY:-}" | tr -d '\r\n')"

          if [ -z "$URL_CLEAN" ]; then
            echo "Missing secret: CRON_PING_URL" >&2
            exit 1
          fi

          HDR=(-H "User-Agent: github-actions-cron")
          if [ -n "$KEY_CLEAN" ]; then
            HDR+=(-H "x-cron-key: $KEY_CLEAN")
          fi

          echo "GET $URL_CLEAN"
          for i in 1 2 3; do
            if curl -fsS -m 30 "${HDR[@]}" "$URL_CLEAN" >/dev/null; then
              echo "Ping OK"
              exit 0
            fi
            echo "Retry $i/3…"; sleep 5
          done
          echo "Ping failed after retries" >&2
          exit 1
