name: Daily family reminders

on:
  schedule:
    # Été (CEST: UTC+2) → 05:30 UTC = 07:30 Paris
    - cron: '30 5 * * *'
    # Hiver (CET: UTC+1) → 06:30 UTC = 07:30 Paris
    - cron: '30 6 * * *'
  # Permet de lancer manuellement depuis l'onglet Actions
  workflow_dispatch: {}

# Permissions minimales
permissions:
  contents: read

# Évite que deux runs se chevauchent si l’un traîne
concurrency:
  group: daily-family-reminders
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call Vercel cron endpoint
        shell: bash
        env:
          URL: ${{ secrets.CRON_PING_URL }}  # crée/maj ce secret dans Settings > Secrets and variables > Actions
        run: |
          set -euo pipefail

          if [ -z "${URL:-}" ]; then
            echo "Missing secret: CRON_PING_URL" >&2
            exit 1
          fi

          # Nettoie d'éventuels retours à la ligne/espaces
          URL_CLEAN="$(printf '%s' "$URL" | tr -d '\r\n')"

          echo "GET $URL_CLEAN"
          # 3 tentatives avec délais courts
          for i in 1 2 3; do
            if curl -fsS -m 30 -H "User-Agent: github-actions-cron" "$URL_CLEAN" >/dev/null; then
              echo "Ping OK"
              exit 0
            fi
            echo "Retry $i/3…"
            sleep 5
          done

          echo "Ping failed after retries" >&2
          exit 1
